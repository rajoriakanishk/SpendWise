<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SpendWise | Admin Sign In</title>
<link rel="stylesheet" href="css/style.css">
<style>
.login-wrap{min-height:100vh;display:grid;place-items:center;padding:24px;background:#f4f8f6}
.login-card{width:min(100%,430px);background:#fff;border:1px solid #e1ebe6;border-radius:20px;padding:32px;box-shadow:0 18px 50px rgba(17,63,46,.09)}
.login-card h1{margin:0 0 8px;font-size:1.7rem}.login-card p{color:#64756d;margin:0 0 24px}.login-card label{display:block;font-weight:600;margin:16px 0 7px}.login-card input{width:100%;padding:12px 13px;border:1px solid #d5e2dc;border-radius:10px;font:inherit}.login-card button{width:100%;margin-top:22px;padding:13px;border:0;border-radius:10px;background:#087e62;color:white;font:inherit;font-weight:700;cursor:pointer}.login-error{min-height:22px;margin-top:12px;color:#b42318;font-size:.92rem}.login-brand{display:flex;align-items:center;gap:10px;color:#087e62;font-weight:800;margin-bottom:24px}.login-brand span{display:grid;place-items:center;background:#e5f5ee;border-radius:10px;width:40px;height:40px}
</style>
</head>
<body>
<main class="login-wrap">
<form class="login-card" id="adminLoginForm">
  <div class="login-brand"><span>◢</span> SpendWise <small style="color:#64756d;font-weight:500">Admin Panel</small></div>
  <h1>Administrator sign in</h1>
  <p>Use your existing SpendWise account with the ADMIN role.</p>
  <label for="email">Email address</label>
  <input id="email" name="email" type="email" autocomplete="username" required>
  <label for="password">Password</label>
  <input id="password" name="password" type="password" autocomplete="current-password" required>
  <button type="submit" id="loginButton">Sign in securely</button>
  <div class="login-error" id="loginError" role="alert" aria-live="polite"></div>
</form>
</main>
<script>
const form=document.querySelector("#adminLoginForm");
form.addEventListener("submit",async event=>{
 event.preventDefault();
 const button=document.querySelector("#loginButton"),error=document.querySelector("#loginError");
 button.disabled=true;button.textContent="Signing in…";error.textContent="";
 try{
  const response=await fetch("http://localhost:8080/api/admin/login",{method:"POST",credentials:"include",headers:{"Content-Type":"application/x-www-form-urlencoded;charset=UTF-8"},body:new URLSearchParams(new FormData(form))});
  const result=await response.json().catch(()=>({}));
  if(!response.ok)throw new Error(result.error||"Sign in failed.");
  window.location.href="index.html";
 }catch(err){error.textContent=err.message||"Cannot connect to SpendWise API. Start the Java server and try again.";}
 finally{button.disabled=false;button.textContent="Sign in securely";}
});
</script>
</body>
</html>
